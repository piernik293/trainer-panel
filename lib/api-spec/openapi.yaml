openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Trainer management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clients
    description: Client management
  - name: surveys
    description: Client surveys
  - name: stats
    description: Dashboard statistics
  - name: public
    description: Public-facing endpoints for client self-service
  - name: notes
    description: Private trainer notes
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{clientId}/survey:
    get:
      operationId: getClientSurvey
      tags: [surveys]
      summary: Get client's survey
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client survey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Survey"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertClientSurvey
      tags: [surveys]
      summary: Create or update client's survey
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurveyInput"
      responses:
        "200":
          description: Saved survey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Survey"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{clientId}/surveys:
    get:
      operationId: listClientSurveys
      tags: [surveys]
      summary: List survey history for a client (newest first)
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Survey history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Survey"

  /clients/{clientId}/surveys/{surveyId}:
    get:
      operationId: getClientSurveyById
      tags: [surveys]
      summary: Get a specific historical survey for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: surveyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Historical survey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Survey"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{clientId}/notes:
    get:
      operationId: listClientNotes
      tags: [notes]
      summary: List private trainer notes for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trainer notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainerNote"
    post:
      operationId: createClientNote
      tags: [notes]
      summary: Add a private trainer note to a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainerNoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainerNote"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{clientId}/notes/{noteId}:
    patch:
      operationId: updateClientNote
      tags: [notes]
      summary: Edit a private trainer note
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: noteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainerNoteInput"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainerNote"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteClientNote
      tags: [notes]
      summary: Delete a private trainer note
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: noteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /public/survey:
    post:
      operationId: submitPublicSurvey
      tags: [public]
      summary: Submit a public client survey (self-service)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicSurveySubmission"
      responses:
        "201":
          description: Survey submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSurveyResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /training-goals-distribution:
    get:
      operationId: getTrainingGoalsDistribution
      tags: [stats]
      summary: Get distribution of training goals across all clients
      responses:
        "200":
          description: Distribution map
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalCount"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ClientStatus:
      type: string
      enum: [active, paused, finished]

    SurveyStatus:
      type: string
      enum: [not_started, incomplete, completed]

    Client:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/ClientStatus"
        hasSurvey:
          type: boolean
        surveyStatus:
          $ref: "#/components/schemas/SurveyStatus"
        lastSurveyDate:
          type: ["string", "null"]
          format: date-time
        trainingGoal:
          type: ["string", "null"]
        experienceLevel:
          type: ["string", "null"]
        weeklyFrequency:
          type: ["integer", "null"]
        preferredMuscles:
          type: ["string", "null"]
        priorityMuscle1:
          type: ["string", "null"]
        trainingLocation:
          type: ["string", "null"]
        cardioPreference:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - firstName
        - lastName
        - status
        - hasSurvey
        - surveyStatus
        - createdAt
        - updatedAt

    ClientInput:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
        notes:
          type: string
        status:
          $ref: "#/components/schemas/ClientStatus"
      required:
        - firstName
        - lastName

    ClientUpdate:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
        notes:
          type: string
        status:
          $ref: "#/components/schemas/ClientStatus"

    Survey:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        trainingGoal:
          type: ["string", "null"]
        experienceLevel:
          type: ["string", "null"]
        trainingDuration:
          type: ["string", "null"]
        healthLimitations:
          type: ["string", "null"]
        weeklyFrequency:
          type: ["integer", "null"]
        sessionDuration:
          type: ["string", "null"]
        preferredMuscles:
          type: ["string", "null"]
        avoidedMuscles:
          type: ["string", "null"]
        avoidedExercises:
          type: ["string", "null"]
        favoriteExercises:
          type: ["string", "null"]
        advancedMethodsToAvoid:
          type: array
          items:
            type: string
        additionalInfo:
          type: ["string", "null"]
        age:
          type: ["integer", "null"]
        dateOfBirth:
          type: ["string", "null"]
          format: date
        gender:
          type: ["string", "null"]
        heightCm:
          type: ["integer", "null"]
        weightKg:
          type: ["integer", "null"]
        activityLevel:
          type: ["string", "null"]
        sleepHours:
          type: ["string", "null"]
        stressLevel:
          type: ["integer", "null"]
        planStylePreference:
          type: ["string", "null"]
        priorityMuscle1:
          type: ["string", "null"]
        priorityMuscle2:
          type: ["string", "null"]
        priorityMuscle3:
          type: ["string", "null"]
        trainingLocation:
          type: ["string", "null"]
        equipment:
          type: ["string", "null"]
        cardioPreference:
          type: ["string", "null"]
        cardioFrequency:
          type: ["string", "null"]
        preferredCardioType:
          type: ["string", "null"]
        avoidsAdvancedMethods:
          type: ["boolean", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - clientId
        - advancedMethodsToAvoid
        - createdAt
        - updatedAt

    SurveyInput:
      type: object
      properties:
        trainingGoal:
          type: string
        experienceLevel:
          type: string
        trainingDuration:
          type: string
        healthLimitations:
          type: string
        weeklyFrequency:
          type: integer
        sessionDuration:
          type: string
        preferredMuscles:
          type: string
        avoidedMuscles:
          type: string
        avoidedExercises:
          type: string
        favoriteExercises:
          type: string
        advancedMethodsToAvoid:
          type: array
          items:
            type: string
        additionalInfo:
          type: string
        age:
          type: integer
          minimum: 0
          maximum: 120
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [Mężczyzna, Kobieta]
        heightCm:
          type: integer
          minimum: 50
          maximum: 260
        weightKg:
          type: integer
          minimum: 20
          maximum: 400
        activityLevel:
          type: string
          enum: [Siedzący, Lekko aktywny, Praca fizyczna, Bardzo aktywny]
        sleepHours:
          type: string
          enum: ["poniżej 6h", "6-7h", "7-8h", "powyżej 8h"]
        stressLevel:
          type: integer
          minimum: 1
          maximum: 10
        planStylePreference:
          type: string
          enum: [Maksymalnie efektywny, Kompromis, Prosty i trwały]
        priorityMuscle1:
          type: string
        priorityMuscle2:
          type: string
        priorityMuscle3:
          type: string
        trainingLocation:
          type: string
        equipment:
          type: string
        cardioPreference:
          type: string
        cardioFrequency:
          type: string
        preferredCardioType:
          type: string
        avoidsAdvancedMethods:
          type: boolean

    TrainerNote:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - clientId
        - content
        - createdAt
        - updatedAt

    TrainerNoteInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
      required:
        - content

    Stats:
      type: object
      properties:
        totalClients:
          type: integer
        surveysCompleted:
          type: integer
        surveysPercent:
          type: number
        activeClients:
          type: integer
        pausedClients:
          type: integer
        finishedClients:
          type: integer
        incompleteSurveys:
          type: integer
        noSurveyClients:
          type: integer
        newSurveysThisWeek:
          type: integer
        recentClients:
          type: array
          items:
            $ref: "#/components/schemas/Client"
      required:
        - totalClients
        - surveysCompleted
        - surveysPercent
        - activeClients
        - pausedClients
        - finishedClients
        - incompleteSurveys
        - noSurveyClients
        - newSurveysThisWeek
        - recentClients

    PublicSurveySubmission:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
        trainingGoal:
          type: string
        experienceLevel:
          type: string
        trainingDuration:
          type: string
        healthLimitations:
          type: string
        weeklyFrequency:
          type: integer
        sessionDuration:
          type: string
        preferredMuscles:
          type: string
        avoidedMuscles:
          type: string
        avoidedExercises:
          type: string
        favoriteExercises:
          type: string
        advancedMethodsToAvoid:
          type: array
          items:
            type: string
        additionalInfo:
          type: string
        age:
          type: integer
          minimum: 0
          maximum: 120
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [Mężczyzna, Kobieta]
        heightCm:
          type: integer
          minimum: 50
          maximum: 260
        weightKg:
          type: integer
          minimum: 20
          maximum: 400
        activityLevel:
          type: string
          enum: [Siedzący, Lekko aktywny, Praca fizyczna, Bardzo aktywny]
        sleepHours:
          type: string
          enum: ["poniżej 6h", "6-7h", "7-8h", "powyżej 8h"]
        stressLevel:
          type: integer
          minimum: 1
          maximum: 10
        planStylePreference:
          type: string
          enum: [Maksymalnie efektywny, Kompromis, Prosty i trwały]
        priorityMuscle1:
          type: string
        priorityMuscle2:
          type: string
        priorityMuscle3:
          type: string
        trainingLocation:
          type: string
        equipment:
          type: string
        cardioPreference:
          type: string
        cardioFrequency:
          type: string
        preferredCardioType:
          type: string
        avoidsAdvancedMethods:
          type: boolean
      required:
        - firstName
        - lastName
        - dateOfBirth
        - gender

    PublicSurveyResponse:
      type: object
      properties:
        success:
          type: boolean
        clientId:
          type: integer
        message:
          type: string
      required:
        - success
        - message

    GoalCount:
      type: object
      properties:
        goal:
          type: string
        count:
          type: integer
      required:
        - goal
        - count
