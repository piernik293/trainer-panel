openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Trainer management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clients
    description: Client management
  - name: surveys
    description: Client surveys
  - name: stats
    description: Dashboard statistics
  - name: public
    description: Public-facing endpoints for client self-service
  - name: notes
    description: Private trainer notes
  - name: exercises
    description: Trainer-only exercise library
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{clientId}/survey:
    get:
      operationId: getClientSurvey
      tags: [surveys]
      summary: Get client's survey
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client survey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Survey"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertClientSurvey
      tags: [surveys]
      summary: Create or update client's survey
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurveyInput"
      responses:
        "200":
          description: Saved survey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Survey"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{clientId}/surveys:
    get:
      operationId: listClientSurveys
      tags: [surveys]
      summary: List survey history for a client (newest first)
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Survey history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Survey"

  /clients/{clientId}/surveys/{surveyId}:
    get:
      operationId: getClientSurveyById
      tags: [surveys]
      summary: Get a specific historical survey for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: surveyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Historical survey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Survey"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{clientId}/notes:
    get:
      operationId: listClientNotes
      tags: [notes]
      summary: List private trainer notes for a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trainer notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainerNote"
    post:
      operationId: createClientNote
      tags: [notes]
      summary: Add a private trainer note to a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainerNoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainerNote"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{clientId}/notes/{noteId}:
    patch:
      operationId: updateClientNote
      tags: [notes]
      summary: Edit a private trainer note
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: noteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainerNoteInput"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainerNote"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteClientNote
      tags: [notes]
      summary: Delete a private trainer note
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: noteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /public/survey:
    post:
      operationId: submitPublicSurvey
      tags: [public]
      summary: Submit a public client survey (self-service)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicSurveySubmission"
      responses:
        "201":
          description: Survey submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSurveyResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /exercises:
    get:
      operationId: listExercises
      tags: [exercises]
      summary: List exercises in the trainer's exercise library
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: mainMuscleGroup
          in: query
          required: false
          schema:
            type: string
        - name: equipment
          in: query
          required: false
          schema:
            type: string
        - name: difficultyLevel
          in: query
          required: false
          schema:
            type: string
        - name: trainingLocation
          in: query
          required: false
          schema:
            type: string
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of exercises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exercise"
    post:
      operationId: createExercise
      tags: [exercises]
      summary: Create a new exercise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseInput"
      responses:
        "201":
          description: Created exercise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /exercises/{id}:
    get:
      operationId: getExercise
      tags: [exercises]
      summary: Get an exercise by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Exercise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateExercise
      tags: [exercises]
      summary: Update an exercise (including activate/deactivate)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseUpdate"
      responses:
        "200":
          description: Updated exercise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /muscles:
    get:
      operationId: listMuscles
      tags: [exercises]
      summary: List specific muscles in the trainer catalogue
      parameters:
        - name: broadCategory
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of specific muscles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpecificMuscle"
    post:
      operationId: createMuscle
      tags: [exercises]
      summary: Add a specific muscle to the catalogue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecificMuscleInput"
      responses:
        "201":
          description: Created specific muscle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecificMuscle"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Muscle name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /exercises/{id}/muscles:
    get:
      operationId: getExerciseMuscles
      tags: [exercises]
      summary: Get specific-muscle assignments for an exercise
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Muscle assignments for this exercise
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExerciseMuscleAssignment"
        "404":
          description: Exercise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: setExerciseMuscles
      tags: [exercises]
      summary: Replace all muscle assignments for an exercise (atomic)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseMusclesInput"
      responses:
        "200":
          description: Updated muscle assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExerciseMuscleAssignment"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Exercise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /exercises/{id}/substitutions:
    get:
      operationId: getExerciseSubstitutions
      tags: [exercises]
      summary: List substitution exercises for an exercise
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of substitutions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExerciseSubstitution"
        "404":
          description: Exercise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addExerciseSubstitution
      tags: [exercises]
      summary: Add a substitution exercise
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSubstitutionBody"
      responses:
        "201":
          description: Created substitution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseSubstitution"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Exercise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Substitution already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /exercises/{id}/substitutions/{substituteId}:
    delete:
      operationId: removeExerciseSubstitution
      tags: [exercises]
      summary: Remove a substitution exercise
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: substituteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Substitution removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /exercises/{id}/progressions:
    get:
      operationId: getExerciseProgressions
      tags: [exercises]
      summary: List progressions and regressions for an exercise
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of progressions/regressions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExerciseProgression"
        "404":
          description: Exercise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addExerciseProgression
      tags: [exercises]
      summary: Add a progression or regression link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProgressionBody"
      responses:
        "201":
          description: Created progression
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseProgression"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Exercise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Progression already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /exercises/{id}/progressions/{progressionId}:
    delete:
      operationId: removeExerciseProgression
      tags: [exercises]
      summary: Remove a progression or regression link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: progressionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Progression removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /training-goals-distribution:
    get:
      operationId: getTrainingGoalsDistribution
      tags: [stats]
      summary: Get distribution of training goals across all clients
      responses:
        "200":
          description: Distribution map
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalCount"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ClientStatus:
      type: string
      enum: [active, paused, finished]

    SurveyStatus:
      type: string
      enum: [not_started, incomplete, completed]

    Client:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/ClientStatus"
        hasSurvey:
          type: boolean
        surveyStatus:
          $ref: "#/components/schemas/SurveyStatus"
        lastSurveyDate:
          type: ["string", "null"]
          format: date-time
        trainingGoal:
          type: ["string", "null"]
        trainingGoalOther:
          type: ["string", "null"]
        experienceLevel:
          type: ["string", "null"]
        weeklyFrequency:
          type: ["integer", "null"]
        preferredMuscles:
          type: ["string", "null"]
        priorityMuscle1:
          type: ["string", "null"]
        trainingLocation:
          type: ["string", "null"]
        cardioPreference:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - firstName
        - lastName
        - status
        - hasSurvey
        - surveyStatus
        - createdAt
        - updatedAt

    ClientInput:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
        notes:
          type: string
        status:
          $ref: "#/components/schemas/ClientStatus"
      required:
        - firstName
        - lastName

    ClientUpdate:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
        notes:
          type: string
        status:
          $ref: "#/components/schemas/ClientStatus"

    Survey:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        trainingGoal:
          type: ["string", "null"]
        trainingGoalOther:
          type: ["string", "null"]
        experienceLevel:
          type: ["string", "null"]
        trainingDuration:
          type: ["string", "null"]
        healthLimitations:
          type: ["string", "null"]
        weeklyFrequency:
          type: ["integer", "null"]
        desiredWeeklyFrequency:
          type: ["integer", "null"]
        sessionDuration:
          type: ["string", "null"]
        preferredMuscles:
          type: ["string", "null"]
        avoidedMuscles:
          type: ["string", "null"]
        avoidedExercises:
          type: ["string", "null"]
        favoriteExercises:
          type: ["string", "null"]
        advancedMethodsToAvoid:
          type: array
          items:
            type: string
        additionalInfo:
          type: ["string", "null"]
        age:
          type: ["integer", "null"]
        dateOfBirth:
          type: ["string", "null"]
          format: date
        gender:
          type: ["string", "null"]
        heightCm:
          type: ["integer", "null"]
        weightKg:
          type: ["integer", "null"]
        activityLevel:
          type: ["string", "null"]
        sleepHours:
          type: ["string", "null"]
        stressLevel:
          type: ["integer", "null"]
        planStylePreference:
          type: ["string", "null"]
        priorityMuscle1:
          type: ["string", "null"]
        priorityMuscle2:
          type: ["string", "null"]
        priorityMuscle3:
          type: ["string", "null"]
        trainingLocation:
          type: ["string", "null"]
        equipment:
          type: ["string", "null"]
        cardioPreference:
          type: ["string", "null"]
        cardioFrequency:
          type: ["string", "null"]
        preferredCardioType:
          type: ["string", "null"]
        avoidsAdvancedMethods:
          type: ["boolean", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - clientId
        - advancedMethodsToAvoid
        - createdAt
        - updatedAt

    SurveyInput:
      type: object
      properties:
        trainingGoal:
          type: string
        trainingGoalOther:
          type: string
        experienceLevel:
          type: string
        trainingDuration:
          type: string
        healthLimitations:
          type: string
        weeklyFrequency:
          type: integer
        desiredWeeklyFrequency:
          type: integer
        sessionDuration:
          type: string
        preferredMuscles:
          type: string
        avoidedMuscles:
          type: string
        avoidedExercises:
          type: string
        favoriteExercises:
          type: string
        advancedMethodsToAvoid:
          type: array
          items:
            type: string
        additionalInfo:
          type: string
        age:
          type: integer
          minimum: 0
          maximum: 120
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [Mężczyzna, Kobieta]
        heightCm:
          type: integer
          minimum: 50
          maximum: 260
        weightKg:
          type: integer
          minimum: 20
          maximum: 400
        activityLevel:
          type: string
          enum: [Siedzący, Lekko aktywny, Praca fizyczna, Bardzo aktywny]
        sleepHours:
          type: string
          enum: ["Poniżej 5 godzin", "5–6 godzin", "6–7 godzin", "7–8 godzin", "Powyżej 8 godzin"]
        stressLevel:
          type: integer
          minimum: 1
          maximum: 10
        planStylePreference:
          type: string
          enum: ["Maksymalna efektywność", "Balans efektywności i wygody", "Prosty i łatwy do utrzymania"]
